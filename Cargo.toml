[workspace]
resolver = "3"
# Crate boundaries are documented in ARCHITECTURE.md.
members = [
    "crates/formation-store",
    "crates/formation-core",
    "crates/formation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/formation"

[workspace.dependencies]
# Shared infrastructure pinned together at the scaffold revision. cw-testkit is dev-only.
cw-base = { git = "https://github.com/constellation-works/satellites", rev = "13e8954eee4967ad1565bdea8738d36ab0d38b3e" }
cw-fs = { git = "https://github.com/constellation-works/satellites", rev = "13e8954eee4967ad1565bdea8738d36ab0d38b3e" }
cw-sqlite = { git = "https://github.com/constellation-works/satellites", rev = "13e8954eee4967ad1565bdea8738d36ab0d38b3e" }
cw-testkit = { git = "https://github.com/constellation-works/satellites", rev = "13e8954eee4967ad1565bdea8738d36ab0d38b3e" }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
formation-store = { path = "crates/formation-store" }
formation-core = { path = "crates/formation-core" }
# text everywhere, which also keeps the help goldens byte-stable.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
strip = true

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
min_ident_chars = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"
# STD-02 R51: a function takes at most seven parameters, the receiver counted.
# The threshold is set in clippy.toml.
too_many_arguments = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rust]
missing_docs = "warn"
